name: Build

on:
  push:
    branches: [ master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, dev ]

# contents: write — necessário pro step "Criar GitHub Release" (Fase 5) criar a
# release e anexar o MSI usando o GITHUB_TOKEN automático, sem secret adicional.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Configuration: Release
      Solution_Platform: Any CPU

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages (packages.config)
        run: nuget restore clawPDF.sln

      - name: Restore NuGet packages (PackageReference)
        run: msbuild clawPDF.sln /t:Restore /p:Configuration=${{ env.Solution_Configuration }} /p:Platform="${{ env.Solution_Platform }}"

      # ---------------------------------------------------------------------
      # Fase 5 do roteiro CLAWPDF — build único em Release|AnyCPU
      # Decisão de escopo: Handoff_SunTzu.md v1.6-1.7 / 08_Fase5_Kickoff.md (06/09/2026)
      #
      # Antes da Fase 5 este job buildava Debug (pro smoke test antigo) E Release
      # (pro MSI) separadamente. Com o smoke test endurecido agora rodando contra
      # o binário instalado de verdade pelo MSI (ver step "Smoke test" mais abaixo),
      # o build Debug ficou redundante — foi retirado. Só existe Release agora,
      # usado tanto pra montar o MSI quanto (via instalação) pro smoke test.
      # /p:SignAssembly=false — override de linha de comando (decisão Fase 2),
      # sem tocar nos .csproj commitados. Strong-name signing não necessário pra CI.
      # ---------------------------------------------------------------------
      - name: Build solution (Release)
        run: >
          msbuild clawPDF.sln
          /p:Configuration=${{ env.Solution_Configuration }}
          /p:Platform="${{ env.Solution_Platform }}"
          /p:SignAssembly=false
          /m
          /v:minimal
          /flp:"logfile=build.log;verbosity=detailed"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # ---------------------------------------------------------------------
      # Fase 5 — versão do MSI derivada da tag semver empurrada
      # Decisão: Handoff_SunTzu.md v1.7 (trigger de release = push de tag vX.Y.Z)
      #
      # Fora de push de tag (push normal em master/dev, PR), usa o fallback
      # 0.9.3.0 definido no .wixproj — não passa -p:ProductVersion nesse caso.
      # Sem automação de bump de versão: a tag em si é a fonte da verdade,
      # Eduardo cria e empurra manualmente (fora de escopo da Fase 5).
      # ---------------------------------------------------------------------
      - name: Determinar versão do MSI a partir da tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace "^refs/tags/v", ""
            if ($tag -match "^\d+\.\d+\.\d+$") {
              $msiVersion = "$tag.0"
              Write-Host "Tag semver detectada: v$tag -> ProductVersion=$msiVersion"
              echo "MSI_PRODUCT_VERSION_ARG=-p:ProductVersion=$msiVersion" >> $env:GITHUB_ENV
            } else {
              Write-Warning "Tag '$tag' nao bate com o padrao X.Y.Z esperado — usando fallback do .wixproj (0.9.3.0). Tags fora de X.Y.Z nao sao suportadas por este parsing simples."
              echo "MSI_PRODUCT_VERSION_ARG=" >> $env:GITHUB_ENV
            }
          } else {
            Write-Host "Push sem tag — usando fallback de versao do .wixproj (0.9.3.0)"
            echo "MSI_PRODUCT_VERSION_ARG=" >> $env:GITHUB_ENV
          }

      # ---------------------------------------------------------------------
      # Fase 4/5 do roteiro CLAWPDF — geração e assinatura do instalador MSI
      # Decisões de escopo: Handoff_SunTzu.md v1.5 (Fase 4) e v1.7 / 08_Fase5_Kickoff.md
      # v1.1 (Fase 5, 06/09/2026)
      #
      # clawPDF_setup.vdproj (Visual Studio Installer Projects) segue excluído
      # do build principal (decisão da Fase 1) — não builda com MSBuild puro e
      # a extensão VSIX não tem suporte confiável em runner headless. Migração
      # pro WiX Toolset v5 (SDK-style .wixproj, restaurado via NuGet/dotnet,
      # sem precisar instalar nada manualmente no runner).
      #
      # O MSI empacota Release|AnyCPU, sem símbolos de debug, com as custom actions
      # de driver de impressora portadas (ver Product.wxs), e é assinado com
      # Authenticode self-signed gerado no próprio CI — decisão explícita de manter
      # a fase dentro de infraestrutura de CI, sem custo/procurement de certificado
      # real. Trade-off aceito: o MSI vai disparar avisos do Windows Defender/
      # SmartScreen no destino (cadeia de confiança não reconhecida) — esperado,
      # não é bug do pipeline.
      # ---------------------------------------------------------------------
      - name: Build MSI (WiX)
        run: >
          dotnet build src\clawPDF_setup_wix\clawPDF_setup_wix.wixproj
          -c Release
          ${{ env.MSI_PRODUCT_VERSION_ARG }}

      # ---------------------------------------------------------------------
      # Fase 5 — achado do run real (06/09/2026): declarar Platform=x64 no
      # .wixproj muda o caminho de saída padrão do MSBuild pra
      # bin\<Platform>\<Configuration>\ (ex: bin\x64\Release\) em vez de
      # bin\<Configuration>\ (bin\Release\) — comportamento padrão do MSBuild
      # quando a plataforma não é AnyCPU. Em vez de continuar adivinhando o
      # caminho exato (já errei uma vez), procura o .msi de verdade onde quer
      # que ele esteja e guarda o caminho real numa env var pros steps seguintes
      # usarem — mais robusto que hardcodar, e resolve o problema na origem.
      # ---------------------------------------------------------------------
      - name: Localizar MSI gerado
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src\clawPDF_setup_wix\bin" -Recurse -Filter "clawPDF_CI.msi" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $msi) {
            Write-Error "FAIL: clawPDF_CI.msi nao encontrado em nenhuma subpasta de src\clawPDF_setup_wix\bin"
            Write-Host "Conteudo de src\clawPDF_setup_wix\bin:"
            Get-ChildItem -Path "src\clawPDF_setup_wix\bin" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          Write-Host "MSI encontrado em: $($msi.FullName)"
          echo "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV

      - name: Gerar certificado self-signed para Authenticode
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=clawPDF CI (self-signed, nao distribuido)" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -NotAfter (Get-Date).AddYears(1)

          Write-Host "Certificado gerado. Thumbprint: $($cert.Thumbprint)"
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Localizar signtool.exe
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Error "signtool.exe nao encontrado em C:\Program Files (x86)\Windows Kits\10\bin no runner"
            exit 1
          }

          Write-Host "signtool encontrado em: $signtool"
          echo "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV

      - name: Assinar MSI (Authenticode self-signed)
        shell: pwsh
        run: |
          $msiPath = $env:MSI_PATH

          & "$env:SIGNTOOL_PATH" sign /fd sha256 /sha1 $env:CERT_THUMBPRINT /tr http://timestamp.digicert.com /td sha256 $msiPath

          if ($LASTEXITCODE -ne 0) {
            Write-Error "FAIL: signtool retornou exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "Verificando assinatura (self-signed, cadeia nao confiavel e esperado, so pra log)"
          & "$env:SIGNTOOL_PATH" verify /pa $msiPath
          Write-Host "signtool verify retornou exit code $LASTEXITCODE (falha esperada aqui, cadeia self-signed nao e confiavel por design)"
          $global:LASTEXITCODE = 0

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawPDF-msi
          path: ${{ env.MSI_PATH }}
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Fase 5 — instalar o MSI de verdade no runner
      # Decisão: Handoff_SunTzu.md v1.7 (portar custom actions de driver, item 4)
      #
      # msiexec roda silencioso (/qn), com log próprio pra debug caso falhe. As
      # custom actions AddPrinterDriver (Product.wxs) rodam aqui dentro, deferred,
      # como parte da sequência normal do MSI — se a instalação do driver falhar,
      # msiexec retorna código de erro e este step falha também (Return="check"
      # na custom action garante isso).
      # ---------------------------------------------------------------------
      - name: Instalar MSI
        shell: pwsh
        run: |
          $msiPath = $env:MSI_PATH
          $logPath = "msi_install.log"

          Write-Host "Instalando $msiPath"
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /qn /norestart /l*v `"$logPath`"" -Wait -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Error "FAIL: msiexec retornou exit code $($proc.ExitCode)"
            Get-Content $logPath -Tail 100
            exit 1
          }

          Write-Host "PASS: MSI instalado (exit code 0)"

      - name: Upload MSI install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-install-log
          path: msi_install.log
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # Fase 5 do roteiro CLAWPDF — smoke test endurecido (critério revisado)
      # Decisão de critério: Handoff_SunTzu.md v1.8 (07/09/2026), substitui o
      # critério "exit 0 puro" da v1.7.
      #
      # Achado #7/#8 (10_Fase5_Execucao_Fechamento.md): "exit 0 puro" é
      # insatisfazível por design — clawPDF é GUI pura e nunca sai sozinho sem
      # /PrintFile= (App.xaml.cs: appStart.Run() + WaitForThreadsAndShutdown
      # espera o usuário fechar a janela). "Processo vivo após timeout" também
      # é ambíguo isoladamente — pode ser a janela principal (driver OK) ou o
      # modal de reparo travado (driver ausente). O diagnóstico Get-Printer/
      # Get-PrinterDriver, que já existia como log, resolve a ambiguidade de
      # forma determinística e vira o próprio gate.
      #
      # Critério novo (substitui o da v1.7):
      #   PASS: Get-Printer encontra a impressora clawPDF E Get-PrinterDriver
      #         encontra o driver "clawPDF Virtual Printer" E o processo
      #         clawPDF.exe fica vivo sem crash após o timeout — ou sai sozinho
      #         com exit code {0,1} dentro do timeout (mesma lógica de saída
      #         controlada já estabelecida na Fase 3).
      #   FAIL: impressora ou driver não encontrados; OU evidência de crash real
      #         (exit code fora de {0,1} ao sair sozinho, ou "Unhandled
      #         Exception" capturado no stdout/stderr antes do processo morrer).
      # ---------------------------------------------------------------------
      - name: Smoke test — driver instalado + processo vivo/saída controlada
        shell: pwsh
        run: |
          $exePath = "C:\Program Files\clawPDF\clawPDF.exe"

          # --- Gate 1: driver de impressora instalado de verdade ---
          Write-Host "=== Verificando impressora e driver clawPDF instalados no runner ==="
          $printers = Get-Printer -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*clawPDF*" }
          $drivers = Get-PrinterDriver -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*clawPDF*" -or $_.Name -like "*ghostpdf*" }

          if ($printers) { $printers | ForEach-Object { Write-Host "  Impressora: $($_.Name) | Driver: $($_.DriverName) | Port: $($_.PortName)" } }
          else { Write-Host "  (nenhuma impressora com 'clawPDF' no nome)" }
          if ($drivers) { $drivers | ForEach-Object { Write-Host "  Driver: $($_.Name)" } }
          else { Write-Host "  (nenhum driver com 'clawPDF'/'ghostpdf' no nome)" }

          if (-not $printers) {
            Write-Error "FAIL: Get-Printer nao encontrou nenhuma impressora clawPDF — custom action AddPrinterDriver nao instalou a impressora"
            exit 1
          }
          if (-not $drivers) {
            Write-Error "FAIL: Get-PrinterDriver nao encontrou o driver clawPDF Virtual Printer — custom action AddPrinterDriver nao registrou o driver"
            exit 1
          }
          Write-Host "PASS (gate 1): impressora e driver clawPDF confirmados instalados"

          # --- Gate 2: processo vivo sem crash, ou saida controlada {0,1} ---
          if (-not (Test-Path $exePath)) {
            Write-Host "clawPDF.exe nao esta em $exePath. Procurando onde a instalacao colocou de fato (diagnostico):"
            foreach ($root in @("C:\Program Files", "C:\Program Files (x86)")) {
              $found = Get-ChildItem -Path $root -Recurse -Filter "clawPDF.exe" -ErrorAction SilentlyContinue -Depth 2 | Select-Object -First 1
              if ($found) { Write-Host "  encontrado em: $($found.FullName)" }
              else { Write-Host "  nada em $root" }
            }
            Write-Error "FAIL: clawPDF.exe não encontrado em $exePath — instalação não colocou o binário onde esperado (ver diagnostico acima)"
            exit 1
          }

          $stdoutFile = "smoke_stdout.log"
          $stderrFile = "smoke_stderr.log"
          $timeoutSeconds = 15

          Write-Host "Iniciando $exePath (timeout: ${timeoutSeconds}s)"

          $process = Start-Process -FilePath $exePath `
            -RedirectStandardOutput $stdoutFile `
            -RedirectStandardError $stderrFile `
            -PassThru

          $exited = $process.WaitForExit($timeoutSeconds * 1000)

          if (-not $exited) {
            Write-Host "Processo ainda rodando apos ${timeoutSeconds}s — com driver confirmado instalado (gate 1), isso e a janela principal do app, nao mais o modal de reparo. Matando o processo e considerando PASS (mesma logica 'vivo = sucesso' da Fase 3)."
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Host "PASS: driver instalado + processo vivo sem crash"
            exit 0
          }

          $exitCode = $process.ExitCode
          Write-Host "Processo saiu sozinho com exit code $exitCode"

          if ($exitCode -eq 0 -or $exitCode -eq 1) {
            Write-Host "PASS: driver instalado + saida controlada (exit code $exitCode)"
          } else {
            Write-Error "FAIL: exit code $exitCode fora do conjunto esperado {0,1} — indica crash real, nao saida controlada"
            Get-Content $stdoutFile -Raw -ErrorAction SilentlyContinue | Write-Host
            Get-Content $stderrFile -Raw -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            smoke_stdout.log
            smoke_stderr.log
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # Fase 5 — criação da GitHub Release (só em push de tag semver)
      # Decisão: Handoff_SunTzu.md v1.7 (trigger de release)
      #
      # gh CLI já vem instalado no runner windows-latest. GITHUB_TOKEN automático
      # (via permissions: contents: write no topo do arquivo) é suficiente, sem
      # secret adicional. Roda só quando o push que disparou o workflow foi uma
      # tag v* — push normal em master/dev não cria release, só builda/testa/
      # publica o MSI como artifact de CI (como já fazia antes da Fase 5).
      # ---------------------------------------------------------------------
      - name: Criar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "$env:MSI_PATH" `
            --title "clawPDF ${{ github.ref_name }}" `
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
