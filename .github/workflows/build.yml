name: Build

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Configuration: Debug
      Solution_Platform: Any CPU

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages (packages.config)
        run: nuget restore clawPDF.sln

      - name: Restore NuGet packages (PackageReference)
        run: msbuild clawPDF.sln /t:Restore /p:Configuration=${{ env.Solution_Configuration }} /p:Platform="${{ env.Solution_Platform }}"

      - name: Build solution
        # /p:SignAssembly=false — override de linha de comando, sem tocar nos .csproj commitados.
        #   Decisão Fase 2: strong-name signing (signClawPDF.pfx) não versionado e não necessário
        #   pra build-only. Reabrir quando existir artefato/release real (Fase 4-5).
        # Solution "Debug|Any CPU" já exclui clawPDF_setup.vdproj do build (confirmado no .sln —
        #   só tem .Build.0 pra ARM64, não pra Any CPU). Não precisa unload manual nem extensão
        #   Visual Studio Installer Projects no runner.
        run: >
          msbuild clawPDF.sln
          /p:Configuration=${{ env.Solution_Configuration }}
          /p:Platform="${{ env.Solution_Platform }}"
          /p:SignAssembly=false
          /m
          /v:minimal
          /flp:"logfile=build.log;verbosity=detailed"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # ---------------------------------------------------------------------
      # Fase 5 do roteiro CLAWPDF — build Release|AnyCPU
      # Decisão de escopo: Handoff_SunTzu.md v1.6 / 08_Fase5_Kickoff.md (06/09/2026)
      #
      # A Fase 4 empacotava a saída Debug|AnyCPU (decisão deliberada, pra não reabrir
      # a config de build naquela fase). A Fase 5 reabre isso: o MSI de release passa
      # a empacotar Release|AnyCPU (sem tocar no build Debug acima, que continua
      # existindo só pro smoke test da Fase 3 — os dois builds coexistem no mesmo job).
      # Mesma configuração do build Debug (SignAssembly=false continua válido aqui —
      # é strong-name signing, decisão da Fase 2, não tem relação com o Authenticode
      # do MSI tratado mais abaixo).
      # ---------------------------------------------------------------------
      - name: Build solution (Release)
        run: >
          msbuild clawPDF.sln
          /p:Configuration=Release
          /p:Platform="${{ env.Solution_Platform }}"
          /p:SignAssembly=false
          /m
          /v:minimal
          /flp:"logfile=build-release.log;verbosity=detailed"

      - name: Upload Release build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-log
          path: build-release.log

      # ---------------------------------------------------------------------
      # Fase 3 do roteiro CLAWPDF — smoke test
      # Decisão de escopo e critério: Handoff_SunTzu.md v1.3 (31/08/2026)
      #
      # clawPDF não tem suíte de testes própria (confirmado: SystemWrapper.Tests não
      # está no .sln principal). No startup (App.xaml.cs), o app checa o Spooler do
      # Windows e se a impressora clawPDF está instalada; como o runner não tem a
      # impressora instalada (isso só existe a partir da Fase 4/MSI), o fluxo de
      # reparo (RepairPrinterAssistant) abre um diálogo modal (MessageWindow.ShowTopMost)
      # perguntando se quer reinstalar os drivers — e trava esperando clique, porque
      # não há ninguém pra clicar. Isso NÃO é um bug, é o comportamento esperado.
      #
      # Critério (decisão Sun Tzu — rejeitou tocar em App.xaml.cs, ficou 100% CI-side):
      #   PASS: processo sai sozinho com exit code {0,1} dentro do timeout, OU
      #         processo continua vivo sem evidência de crash após o timeout
      #         (nesse caso, mata o processo e considera sucesso — "vivo e sem
      #         crash" é o sinal esperado quando o modal de reparo está esperando).
      #   FAIL: exit code fora de {0,1}, ou evidência de crash real (ex: "Unhandled
      #         Exception", access violation) capturada no stdout/stderr antes do
      #         processo morrer.
      # ---------------------------------------------------------------------
      - name: Smoke test — clawPDF.exe inicia sem crash
        shell: pwsh
        run: |
          # OutputPath real pra Debug|AnyCPU é "..\_Build\Debug\" relativo ao
          # csproj (clawPDF.csproj), não "bin\Debug\" (isso é só pra Debug|x86).
          $exePath = "src\_Build\Debug\clawPDF.exe"

          if (-not (Test-Path $exePath)) {
            Write-Error "FAIL: clawPDF.exe não encontrado em $exePath — build não produziu o artefato esperado"
            exit 1
          }

          $stdoutFile = "smoke_stdout.log"
          $stderrFile = "smoke_stderr.log"
          $timeoutSeconds = 15

          Write-Host "Iniciando $exePath (timeout: ${timeoutSeconds}s)"

          $process = Start-Process -FilePath $exePath `
            -RedirectStandardOutput $stdoutFile `
            -RedirectStandardError $stderrFile `
            -PassThru

          $exited = $process.WaitForExit($timeoutSeconds * 1000)

          if ($exited) {
            $exitCode = $process.ExitCode
            Write-Host "Processo saiu sozinho com exit code $exitCode"

            if ($exitCode -eq 0 -or $exitCode -eq 1) {
              Write-Host "PASS: exit code $exitCode dentro do esperado {0,1}"
            } else {
              Write-Error "FAIL: exit code $exitCode fora do esperado {0,1} — possível crash real"
              exit 1
            }
          } else {
            Write-Host "Processo ainda rodando após ${timeoutSeconds}s — checando evidência de crash antes de matar"

            $stdoutContent = Get-Content $stdoutFile -Raw -ErrorAction SilentlyContinue
            $stderrContent = Get-Content $stderrFile -Raw -ErrorAction SilentlyContinue
            $combined = "$stdoutContent`n$stderrContent"

            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

            if ($combined -match "Unhandled Exception" -or $combined -match "[Aa]ccess violation") {
              Write-Error "FAIL: evidência de crash real encontrada no output antes de matar o processo"
              Write-Host "--- stdout ---`n$stdoutContent"
              Write-Host "--- stderr ---`n$stderrContent"
              exit 1
            } else {
              Write-Host "PASS: processo estava vivo sem evidência de crash — comportamento esperado (modal de reparo de impressora travando, sem impressora instalada no runner)"
            }
          }

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            smoke_stdout.log
            smoke_stderr.log
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # Fase 4/5 do roteiro CLAWPDF — geração e assinatura do instalador MSI
      # Decisões de escopo: Handoff_SunTzu.md v1.5 (Fase 4) e v1.6 / 08_Fase5_Kickoff.md
      # (Fase 5, 06/09/2026)
      #
      # clawPDF_setup.vdproj (Visual Studio Installer Projects) segue excluído
      # do build principal (decisão da Fase 1) — não builda com MSBuild puro e
      # a extensão VSIX não tem suporte confiável em runner headless. Migração
      # pro WiX Toolset v5 (SDK-style .wixproj, restaurado via NuGet/dotnet,
      # sem precisar instalar nada manualmente no runner).
      #
      # A partir da Fase 5: o MSI empacota Release|AnyCPU (não mais Debug, decisão
      # revisada) e é assinado com Authenticode self-signed gerado no próprio CI —
      # decisão explícita de manter a fase dentro de infraestrutura de CI, sem
      # custo/procurement de certificado real. Trade-off aceito: o MSI vai disparar
      # avisos do Windows Defender/SmartScreen no destino (cadeia de confiança não
      # reconhecida) — esperado, não é bug do pipeline.
      # ---------------------------------------------------------------------
      - name: Build MSI (WiX)
        run: >
          dotnet build src\clawPDF_setup_wix\clawPDF_setup_wix.wixproj
          -c Release

      - name: Gerar certificado self-signed para Authenticode
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=clawPDF CI (self-signed, nao distribuido)" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -NotAfter (Get-Date).AddYears(1)

          Write-Host "Certificado gerado. Thumbprint: $($cert.Thumbprint)"
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Localizar signtool.exe
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Error "signtool.exe nao encontrado em C:\Program Files (x86)\Windows Kits\10\bin no runner"
            exit 1
          }

          Write-Host "signtool encontrado em: $signtool"
          echo "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV

      - name: Assinar MSI (Authenticode self-signed)
        shell: pwsh
        run: |
          $msiPath = "src\clawPDF_setup_wix\bin\Release\clawPDF_CI.msi"

          if (-not (Test-Path $msiPath)) {
            Write-Error "FAIL: MSI nao encontrado em $msiPath"
            exit 1
          }

          & "$env:SIGNTOOL_PATH" sign /fd sha256 /sha1 $env:CERT_THUMBPRINT /tr http://timestamp.digicert.com /td sha256 $msiPath

          if ($LASTEXITCODE -ne 0) {
            Write-Error "FAIL: signtool retornou exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "Verificando assinatura (self-signed, cadeia nao confiavel e esperado)"
          & "$env:SIGNTOOL_PATH" verify /pa $msiPath

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawPDF-msi
          path: src\clawPDF_setup_wix\bin\Release\clawPDF_CI.msi
          if-no-files-found: error
